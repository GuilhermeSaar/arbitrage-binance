services:
  postgres:
    image: postgres:18.6-alpine
    container_name: binance-arbitrage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: binance_arbitrage
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-binance_app}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

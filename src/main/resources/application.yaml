spring:
  application:
    name: binance-arbitrage
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/binance_arbitrage}
    username: ${SPRING_DATASOURCE_USERNAME:binance_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
